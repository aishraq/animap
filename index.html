<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animap</title>
<meta name="description" content="A star map of anime. Find a show you love and see what to watch next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #15132e;
    --night-deep: #0e0c22;
    --surface: rgba(30, 27, 64, .9);
    --surface-solid: #1e1b40;
    --raised: #29255a;
    --edge: #39347a;
    --moon: #ecebff;
    --lilac: #9d99cc;
    --sakura: #ff7eb6;
    --ice: #72e6ff;
    --font: "M PLUS Rounded 1c", ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--moon); font: 500 14px/1.5 var(--font); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointing { cursor: pointer; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  a { color: var(--ice); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Top left: wordmark and search */
  #top { position: fixed; top: 16px; left: 16px; width: min(380px, calc(100vw - 32px)); z-index: 3; }
  .wordmark { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px 4px; user-select: none; }
  .wordmark b { font-size: 26px; font-weight: 800; letter-spacing: -.01em; background: linear-gradient(100deg, var(--moon) 30%, var(--sakura)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wordmark span { font-size: 13px; color: var(--lilac); letter-spacing: .12em; }
  .searchbox { position: relative; }
  .searchbox svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--lilac); pointer-events: none; }
  #q { width: 100%; padding: 12px 16px 12px 42px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--surface-solid); font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
  #q::placeholder { color: var(--lilac); }
  #q:focus { border-color: var(--sakura); box-shadow: 0 0 0 4px rgba(255, 126, 182, .15); }
  #results { margin-top: 8px; background: var(--surface-solid); border: 1.5px solid var(--edge); border-radius: 18px; overflow: hidden; display: none; box-shadow: 0 12px 40px rgba(5, 3, 20, .5); }
  #results.open { display: block; }
  .result { display: flex; gap: 12px; align-items: center; padding: 8px 12px; cursor: pointer; }
  .result:hover, .result.active { background: var(--raised); }
  .result img { width: 34px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--raised); flex: none; }
  .result .name { font-weight: 700; line-height: 1.3; }
  .result .sub { color: var(--lilac); font-size: 12px; }
  .empty { padding: 12px 16px; color: var(--lilac); font-size: 13px; }
  .modes { display: inline-flex; gap: 4px; margin-top: 8px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--edge); }
  .modes button { border: 0; border-radius: 999px; padding: 4px 12px; background: none; color: var(--lilac); font-size: 12px; font-weight: 700; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--ice); color: var(--night-deep); }
  .examples { padding: 12px 14px 14px; }
  .examples p { margin: 0 0 8px; color: var(--lilac); font-size: 12px; }
  .examples button { margin: 0 6px 6px 0; padding: 4px 11px; border-radius: 999px; border: 1.5px solid var(--edge); background: none; color: var(--moon); font-size: 12px; cursor: pointer; }
  .examples button:hover { border-color: var(--ice); color: var(--ice); }
  .status { padding: 12px 16px; color: var(--lilac); font-size: 13px; }
  .status .bar { height: 4px; margin-top: 8px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .status .bar span { display: block; height: 100%; background: var(--ice); transition: width .2s; }
  .rank { width: 22px; flex: none; text-align: right; color: var(--ice); font-weight: 800; font-size: 12px; }

  /* Bottom left: star size switch and credit */
  #bottom { position: fixed; left: 16px; bottom: 14px; z-index: 2; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .switch { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--edge); }
  .switch span { padding: 0 8px 0 10px; color: var(--lilac); font-size: 12px; }
  .switch button { border: 0; border-radius: 999px; padding: 5px 12px; background: none; color: var(--lilac); font-size: 12px; font-weight: 700; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--sakura); color: var(--night-deep); }
  .credit { color: var(--lilac); font-size: 11px; opacity: .8; }

  /* Right: the show panel */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-left: 1.5px solid var(--edge); z-index: 4; overflow-y: auto; overflow-x: hidden; transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  #panel.open { transform: none; }
  .banner { height: 130px; background-size: cover; background-position: center 30%; filter: blur(18px) saturate(1.4); opacity: .55; margin: -20px -20px 0; }
  .close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(14, 12, 34, .6); color: var(--moon); font-size: 20px; line-height: 1; cursor: pointer; z-index: 1; }
  .close:hover { background: var(--sakura); color: var(--night-deep); }
  .hero { display: flex; gap: 16px; padding: 0 20px; margin-top: -70px; position: relative; }
  .hero img { width: 104px; height: 148px; object-fit: cover; border-radius: 14px; background: var(--raised); flex: none; box-shadow: 0 10px 30px rgba(5, 3, 20, .6); border: 2px solid rgba(236, 235, 255, .15); }
  .hero .text { padding-top: 70px; min-width: 0; }
  .hero h2 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
  .native { color: var(--lilac); font-size: 13px; margin-top: 2px; }
  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--lilac); font-size: 12px; }
  .score { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 999px; }
  .score.top { background: rgba(255, 126, 182, .18); color: var(--sakura); }
  .score.good { background: rgba(114, 230, 255, .14); color: var(--ice); }
  .score.ok { background: rgba(157, 153, 204, .16); color: var(--lilac); }
  .about { padding: 14px 20px 4px; }
  .studio { color: var(--lilac); font-size: 12px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { font-size: 12px; padding: 3px 11px; border-radius: 999px; background: var(--raised); color: var(--moon); }
  .chip.tag { background: none; border: 1.5px solid var(--edge); color: var(--lilac); }
  .anilist { font-size: 13px; font-weight: 700; }
  .synopsis { margin: 12px 0 4px; }
  .synopsis p { margin: 0; font-size: 13px; line-height: 1.65; color: #d4d2f0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .synopsis.open p { -webkit-line-clamp: unset; display: block; }
  .more { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--ice); font-size: 12px; font-weight: 700; cursor: pointer; }
  .watchnext { margin: 18px 20px 10px; font-size: 17px; font-weight: 800; }
  .watchnext small { display: block; font-size: 12px; font-weight: 500; color: var(--lilac); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; padding: 0 20px 28px; }
  .card { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; min-width: 0; }
  .poster { position: relative; aspect-ratio: 7 / 10; border-radius: 12px; overflow: hidden; background: var(--raised); transition: transform .15s; }
  .card:hover .poster, .card:focus-visible .poster { transform: translateY(-3px); }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .match { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: rgba(14, 12, 34, .82); color: var(--sakura); }
  .card .t { margin-top: 6px; font-size: 12px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .y { font-size: 11px; color: var(--lilac); }

  /* Hover card */
  #tooltip { position: fixed; pointer-events: none; z-index: 5; display: none; gap: 10px; align-items: center; background: var(--surface-solid); border: 1.5px solid var(--edge); border-radius: 14px; padding: 8px 12px 8px 8px; max-width: 300px; box-shadow: 0 12px 30px rgba(5, 3, 20, .5); }
  #tooltip img { width: 40px; height: 57px; object-fit: cover; border-radius: 8px; background: var(--raised); flex: none; }
  #tooltip .name { font-weight: 800; line-height: 1.25; }
  #tooltip .sub { color: var(--lilac); font-size: 12px; margin-top: 2px; }
  #tooltip .score { font-size: 11px; padding: 0 7px; margin-left: 4px; }

  #error { position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: var(--lilac); padding: 16px; }

  @media (max-width: 700px) {
    #panel { top: auto; height: 72vh; width: 100vw; border-left: 0; border-top: 1.5px solid var(--edge); border-radius: 22px 22px 0 0; transform: translateY(100%); }
    .wordmark b { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #panel, .poster, #q { transition: none; }
  }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of anime, where similar shows sit close together"></canvas>

<div id="top">
  <div class="wordmark"><b>Animap</b><span lang="ja">アニマップ</span></div>
  <div class="searchbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find an anime you love" autocomplete="off" spellcheck="false" aria-label="Search anime by any title">
  </div>
  <div class="modes" role="group" aria-label="Search by">
    <button type="button" data-mode="title" aria-pressed="true">By title</button>
    <button type="button" data-mode="mood" aria-pressed="false">By mood</button>
  </div>
  <div id="results" role="listbox"></div>
</div>

<div id="bottom">
  <div class="switch" role="group" aria-label="Star size">
    <span>Star size</span>
    <button type="button" data-size="score" aria-pressed="true">Score</button>
    <button type="button" data-size="popularity" aria-pressed="false">Popularity</button>
  </div>
  <div class="credit">Scroll to zoom, drag to explore. Data from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>.</div>
</div>

<aside id="panel" aria-live="polite"></aside>
<div id="tooltip"></div>
<div id="error">The map data is missing. Run <code>uv run reduce.py</code> to create animap.js next to this file.</div>

<script src="animap.js"></script>
<script>
"use strict";

const data = window.ANIMAP;
if (!data) {
  document.getElementById("error").style.display = "grid";
  throw new Error("animap.js missing");
}
const points = data.points;
const clusters = data.clusters;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const LABEL_FONT = '"M PLUS Rounded 1c", system-ui, sans-serif';

// ---------- colours ----------

// Neon pastels picked to glow against the indigo night.
const palette = ["#ff7eb6", "#72e6ff", "#ffd36e", "#a98bff", "#7dffb2", "#ff9f6e", "#6ea8ff", "#f88bff", "#c6ff6e", "#ff6e8a", "#6effe8", "#ffb3d9", "#b3c6ff", "#ffe9a8", "#8affd0", "#d9a8ff"];
const clusterColour = c => c < 0 ? "#8a86b8" : palette[c % palette.length];
for (const p of points) {
  p.colour = clusterColour(p.cluster >= 0 ? p.cluster : p.soft);
  p.loose = p.cluster < 0;
}

// Each colour gets one pre-rendered glowing star, drawn scaled per point.
// Much cheaper than canvas shadows on a thousand points every frame.
const SPRITE = 64;
const sprites = new Map();
function sprite(colour) {
  if (sprites.has(colour)) return sprites.get(colour);
  const c = document.createElement("canvas");
  c.width = c.height = SPRITE;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(0.12, colour);
  grad.addColorStop(0.25, colour);
  grad.addColorStop(0.34, colour + "40");
  grad.addColorStop(0.6, colour + "10");
  grad.addColorStop(1, colour + "00");
  g.fillStyle = grad;
  g.fillRect(0, 0, SPRITE, SPRITE);
  sprites.set(colour, c);
  return c;
}

// ---------- star size ----------

let sizeMode = "score";
try { sizeMode = localStorage.getItem("animap-size") || "score"; } catch (e) {}

const maxPop = Math.max(...points.map(p => p.popularity));
function baseRadius(p) {
  if (sizeMode === "popularity") return 2.2 + 8 * Math.sqrt(p.popularity / maxPop);
  if (!p.score) return 2.2;
  // Most scores sit between 63 and 84, so stretch that band: a 70 stays small,
  // an 85 is clearly a big star.
  const t = Math.min(1, Math.max(0, (p.score - 62) / 26));
  return 2 + 9 * Math.pow(t, 1.5);
}
function applySize() {
  for (const p of points) p.r = baseRadius(p);
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.size === sizeMode)));
  draw();
}
document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  sizeMode = b.dataset.size;
  try { localStorage.setItem("animap-size", sizeMode); } catch (e) {}
  applySize();
}));

// ---------- view ----------

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let width = 0, height = 0, dpr = 1;
const view = { x: 500, y: 500, scale: 1 };
let homeScale = 1;

const toScreen = (x, y) => [(x - view.x) * view.scale + width / 2, (y - view.y) * view.scale + height / 2];
const toWorld = (sx, sy) => [(sx - width / 2) / view.scale + view.x, (sy - height / 2) / view.scale + view.y];
const radius = p => p.r * Math.min(2.2, Math.max(0.75, Math.sqrt(view.scale / homeScale)));

// Faint background stars, fixed to the screen so the sky feels deep.
let dust = [];
function makeDust() {
  dust = [];
  const n = Math.round(width * height / 9000);
  for (let i = 0; i < n; i++) dust.push([Math.random() * width, Math.random() * height, Math.random() * 0.9 + 0.2, Math.random() * 0.35 + 0.05]);
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  makeDust();
  draw();
}

// Frame the middle 96% of shows so a few far-off stars don't shrink the view.
function fitAll() {
  const pct = (arr, q) => arr[Math.floor(q * (arr.length - 1))];
  const xs = points.map(p => p.x).sort((a, b) => a - b), ys = points.map(p => p.y).sort((a, b) => a - b);
  const minX = pct(xs, 0.02), maxX = pct(xs, 0.98), minY = pct(ys, 0.02), maxY = pct(ys, 0.98);
  view.scale = 0.88 * Math.min(width / (maxX - minX), (height - 60) / (maxY - minY));
  view.x = (minX + maxX) / 2;
  view.y = (minY + maxY) / 2;
  homeScale = view.scale;
}

// ---------- drawing ----------

let hovered = null;
let selected = null;
let moodHits = null;
let reveal = 1;
let drawQueued = false;

function draw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; render(); });
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = ctx.createRadialGradient(width * 0.5, height * 0.45, 0, width * 0.5, height * 0.45, Math.max(width, height) * 0.75);
  sky.addColorStop(0, "#1c1940");
  sky.addColorStop(1, "#0e0c22");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = "#ecebff";
  for (const [x, y, r, a] of dust) {
    ctx.globalAlpha = a;
    ctx.fillRect(x, y, r, r);
  }
  ctx.globalAlpha = 1;

  const near = selected ? new Set(selected.nn.map(i => points[i])) : moodHits ? new Set(moodHits) : null;
  const focus = selected || moodHits;

  // The selected show's constellation: lines out to its similar shows, drawn
  // in when it's picked.
  if (selected) {
    const [sx, sy] = toScreen(selected.x, selected.y);
    ctx.lineCap = "round";
    selected.nn.forEach((i, rank) => {
      const q = points[i];
      const [qx, qy] = toScreen(q.x, q.y);
      const t = Math.min(1, Math.max(0, reveal * 1.6 - rank * 0.03));
      if (t <= 0) return;
      const grad = ctx.createLinearGradient(sx, sy, qx, qy);
      grad.addColorStop(0, `rgba(255,126,182,${0.75 - rank * 0.025})`);
      grad.addColorStop(1, `rgba(255,126,182,${0.25 - rank * 0.01})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = rank < 5 ? 1.6 : 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + (qx - sx) * t, sy + (qy - sy) * t);
      ctx.stroke();
    });
  }

  for (const p of points) {
    const [x, y] = toScreen(p.x, p.y);
    const r = radius(p);
    if (x < -4 * r || y < -4 * r || x > width + 4 * r || y > height + 4 * r) continue;
    let alpha = p.loose ? 0.55 : 0.95;
    if (focus && p !== selected && !near.has(p)) alpha = 0.16;
    ctx.globalAlpha = alpha;
    if (sizeMode === "score" && !p.score) {
      ctx.strokeStyle = p.colour;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(x, y, r + 1, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      const s = r * 6.5;
      ctx.drawImage(sprite(p.colour), x - s / 2, y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;

  if (moodHits && !selected) {
    ctx.strokeStyle = "#72e6ff";
    ctx.lineWidth = 1.5;
    for (const p of moodHits) {
      const [x, y] = toScreen(p.x, p.y);
      ctx.beginPath();
      ctx.arc(x, y, radius(p) + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  for (const [p, colour] of [[selected, "#ff7eb6"], [hovered, "#ecebff"]]) {
    if (!p) continue;
    const [x, y] = toScreen(p.x, p.y);
    ctx.strokeStyle = colour;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, radius(p) + 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  drawLabels(near);
}

const byPopularity = points.slice().sort((a, b) => b.popularity - a.popularity);

// Titles for well-known shows that fit without overlapping, plus constellation
// names when zoomed out. Boxes already drawn block later labels.
function drawLabels(near) {
  const boxes = [];
  const fits = (x, y, w, h) => {
    if (x < 0 || y < 0 || x + w > width || y + h > height) return false;
    for (const b of boxes) if (x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + h > b[1]) return false;
    boxes.push([x, y, w, h]);
    return true;
  };
  ctx.textBaseline = "middle";

  const label = (p, strong) => {
    const [x, y] = toScreen(p.x, p.y);
    ctx.font = `${strong ? 800 : 500} 12px ${LABEL_FONT}`;
    const text = p.title.length > 32 ? p.title.slice(0, 31) + "…" : p.title;
    const w = ctx.measureText(text).width;
    const lx = x + radius(p) + 8;
    if (!fits(lx - 6, y - 10, w + 12, 20)) return;
    ctx.fillStyle = strong ? "rgba(255,126,182,.95)" : "rgba(14,12,34,.72)";
    roundRect(lx - 6, y - 10, w + 12, 20, 10);
    ctx.fillStyle = strong ? "#0e0c22" : "#d9d7f5";
    ctx.fillText(text, lx, y + 0.5);
  };

  if (selected) {
    label(selected, true);
    for (const i of selected.nn) label(points[i], false);
  } else if (moodHits) {
    for (const p of moodHits) label(p, false);
  }
  if (hovered && hovered !== selected) label(hovered, false);

  const zoom = view.scale / homeScale;
  const clusterAlpha = Math.max(0, Math.min(1, 2.6 - zoom));
  if (clusterAlpha > 0 && !selected && !moodHits) {
    ctx.font = `700 12px ${LABEL_FONT}`;
    ctx.globalAlpha = clusterAlpha;
    for (const c of [...clusters].sort((a, b) => b.size - a.size)) {
      const [x, y] = toScreen(c.x, c.y);
      const w = ctx.measureText(c.label).width;
      if (!fits(x - w / 2 - 10, y - 11, w + 20, 22)) continue;
      const colour = clusterColour(c.id);
      ctx.fillStyle = "rgba(14,12,34,.78)";
      roundRect(x - w / 2 - 10, y - 11, w + 20, 22, 11);
      ctx.strokeStyle = colour + "88";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = colour;
      ctx.fillText(c.label, x - w / 2, y + 0.5);
    }
    ctx.globalAlpha = 1;
  }

  // Zoomed out, only the best-known titles; zoomed in, anything that fits.
  const limit = zoom < 1.8 ? 15 : zoom < 3.5 ? 60 : points.length;
  for (const p of byPopularity.slice(0, limit)) {
    if (focus && p !== selected && !near.has(p)) continue;
    label(p, false);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

// ---------- hit testing ----------

const cellSize = 20;
const grid = new Map();
for (const p of points) {
  const key = Math.floor(p.x / cellSize) + "," + Math.floor(p.y / cellSize);
  if (!grid.has(key)) grid.set(key, []);
  grid.get(key).push(p);
}

function pointAt(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  const reach = Math.max(1, Math.ceil(16 / view.scale / cellSize));
  const cx = Math.floor(wx / cellSize), cy = Math.floor(wy / cellSize);
  let best = null, bestD = Infinity;
  for (let dx = -reach; dx <= reach; dx++) {
    for (let dy = -reach; dy <= reach; dy++) {
      for (const p of grid.get((cx + dx) + "," + (cy + dy)) || []) {
        const [x, y] = toScreen(p.x, p.y);
        const d = Math.hypot(x - sx, y - sy);
        if (d < Math.max(radius(p) + 5, 9) && d < bestD) { best = p; bestD = d; }
      }
    }
  }
  return best;
}

// ---------- pan, zoom, pinch ----------

const pointers = new Map();
let dragMoved = false;
let pinchStart = null;

function zoomAt(sx, sy, factor) {
  const [wx, wy] = toWorld(sx, sy);
  view.scale = Math.min(homeScale * 40, Math.max(homeScale * 0.4, view.scale * factor));
  view.x = wx - (sx - width / 2) / view.scale;
  view.y = wy - (sy - height / 2) / view.scale;
  draw();
}

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cancelFlight();
  zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  dragMoved = false;
  cancelFlight();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale };
  }
});

canvas.addEventListener("pointermove", e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) {
    setHover(pointAt(e.offsetX, e.offsetY), e);
    return;
  }
  const now = { x: e.offsetX, y: e.offsetY };
  pointers.set(e.pointerId, now);
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinchStart.scale * dist / pinchStart.dist / view.scale);
    dragMoved = true;
    return;
  }
  const dx = now.x - prev.x, dy = now.y - prev.y;
  if (dx || dy) {
    if (Math.hypot(dx, dy) > 2) dragMoved = true;
    view.x -= dx / view.scale;
    view.y -= dy / view.scale;
    canvas.classList.add("dragging");
    setHover(null);
    draw();
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  canvas.classList.remove("dragging");
  if (!dragMoved && pointers.size === 0 && e.type === "pointerup") {
    const p = pointAt(e.offsetX, e.offsetY);
    if (p) select(p, false);
    else if (selected) closePanel();
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => setHover(null));

// ---------- hover card ----------

const tooltip = document.getElementById("tooltip");

function setHover(p, e) {
  if (p !== hovered) {
    hovered = p;
    canvas.classList.toggle("pointing", !!p);
    draw();
  }
  if (!p) { tooltip.style.display = "none"; return; }
  tooltip.innerHTML = `<img src="${esc(p.cover || "")}" alt="">
    <div><div class="name">${esc(p.title)}</div>
    <div class="sub">${esc(yearFormat(p))}${p.score ? `<span class="score ${tier(p.score)}">★ ${p.score}%</span>` : ""}</div>
    <div class="sub">${esc(p.tags.slice(0, 3).join(", "))}</div></div>`;
  tooltip.style.display = "flex";
  const tx = Math.min(e.clientX + 16, window.innerWidth - tooltip.offsetWidth - 8);
  const ty = Math.min(e.clientY + 16, window.innerHeight - tooltip.offsetHeight - 8);
  tooltip.style.left = tx + "px";
  tooltip.style.top = ty + "px";
}

// ---------- motion ----------

let flight = null;
function cancelFlight() { if (flight) { cancelAnimationFrame(flight); flight = null; reveal = 1; } }

function animate(duration, step) {
  cancelFlight();
  if (reduceMotion) { step(1); render(); return; }
  const start = performance.now();
  const tick = now => {
    const t = Math.min(1, (now - start) / duration);
    step(t);
    render();
    flight = t < 1 ? requestAnimationFrame(tick) : null;
  };
  flight = requestAnimationFrame(tick);
}

function flyTo(x, y, scale) {
  const from = { ...view };
  animate(700, t => {
    const k = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    view.x = from.x + (x - from.x) * k;
    view.y = from.y + (y - from.y) * k;
    view.scale = Math.exp(Math.log(from.scale) + (Math.log(scale) - Math.log(from.scale)) * k);
    reveal = Math.max(0, (t - 0.35) / 0.65);
  });
}

// Frame the selected show with its closest matches, leaving room for the panel.
function frameSelection(p) {
  const group = [p, ...p.nn.slice(0, 8).map(i => points[i])];
  const xs = group.map(q => q.x), ys = group.map(q => q.y);
  const panelW = width > 700 ? 400 : 0;
  const panelH = width > 700 ? 0 : height * 0.72;
  const spanX = Math.max(40, Math.max(...xs) - Math.min(...xs));
  const spanY = Math.max(40, Math.max(...ys) - Math.min(...ys));
  const scale = Math.min(homeScale * 12, Math.max(homeScale, Math.min((width - panelW - 120) / spanX, (height - panelH - 140) / spanY)));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2 + panelW / 2 / scale;
  const cy = (Math.max(...ys) + Math.min(...ys)) / 2 + panelH / 2 / scale;
  flyTo(cx, cy, scale);
}

// ---------- panel ----------

const panel = document.getElementById("panel");

function select(p, fly = true) {
  selected = p;
  moodHits = null;
  if (mode === "title") input.value = p.title;
  renderPanel(p);
  if (fly) {
    frameSelection(p);
  } else {
    animate(450, t => { reveal = t; });
  }
}

function closePanel() {
  selected = null;
  panel.classList.remove("open");
  draw();
}

function renderPanel(p) {
  const native = p.native && p.native !== p.title ? `<div class="native" lang="ja">${esc(p.native)}</div>` : "";
  const facts = [
    p.year,
    fmt(p.format),
    p.episodes ? `${p.episodes} episodes` : null,
    p.parts > 1 ? `${p.parts} entries in the franchise` : null,
  ].filter(Boolean).map(f => `<span>${esc(f)}</span>`).join("");
  const cards = p.nn.map((i, rank) => {
    const q = points[i];
    const pct = p.nnMatch[rank];
    return `<button type="button" class="card" data-i="${i}" title="${esc(q.title)}">
      <div class="poster"><img src="${esc(q.cover || "")}" alt="" loading="lazy"><span class="match">${pct}% match</span></div>
      <div class="t">${esc(q.title)}</div>
      <div class="y">${esc(yearFormat(q))}</div>
    </button>`;
  }).join("");

  panel.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="banner" style="background-image:url('${esc(p.cover || "")}')"></div>
    <div class="hero">
      <img src="${esc(p.cover || "")}" alt="">
      <div class="text"><h2>${esc(p.title)}</h2>${native}</div>
    </div>
    <div class="about">
      <div class="facts">${p.score ? `<span class="score ${tier(p.score)}">★ ${p.score}%</span>` : ""}${facts}</div>
      ${p.studios.length ? `<div class="studio">Made by ${esc(p.studios.join(", "))}</div>` : ""}
      ${p.synopsis ? `<div class="synopsis"><p>${esc(p.synopsis)}</p><button type="button" class="more">Read more</button></div>` : ""}
      <div class="chips">${p.genres.map(g => `<span class="chip">${esc(g)}</span>`).join("")}${p.tags.map(t => `<span class="chip tag">${esc(t)}</span>`).join("")}</div>
      <a class="anilist" href="${esc(p.url)}" target="_blank" rel="noopener">Open on AniList</a>
    </div>
    <div class="watchnext">Watch next<small>The 20 shows most like this one</small></div>
    <div class="grid">${cards}</div>`;
  panel.classList.add("open");
  panel.scrollTop = 0;
  panel.querySelector(".close").onclick = closePanel;
  const synopsis = panel.querySelector(".synopsis");
  if (synopsis) {
    const more = synopsis.querySelector(".more");
    const text = synopsis.querySelector("p");
    // Only offer "Read more" when the text is actually cut off.
    if (text.scrollHeight <= text.clientHeight + 2) more.remove();
    else more.onclick = () => {
      const open = synopsis.classList.toggle("open");
      more.textContent = open ? "Show less" : "Read more";
    };
  }
  panel.querySelectorAll(".card").forEach(el => el.onclick = () => select(points[+el.dataset.i]));
}

// ---------- fuzzy search ----------

// Normalise a title so romanisation and punctuation differences don't matter:
// "Shōjo", "Shoujo" and "Shojo" all become "shojo".
function norm(s) {
  return s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/ou/g, "o").replace(/oo/g, "o").replace(/uu/g, "u").replace(/ii/g, "i")
    .replace(/[^\p{L}\p{N}]+/gu, " ").trim();
}

function trigrams(s) {
  const padded = `  ${s} `;
  const set = new Set();
  for (let i = 0; i < padded.length - 2; i++) set.add(padded.slice(i, i + 3));
  return set;
}

const index = [];
points.forEach((p, i) => {
  const seen = new Set();
  for (const t of [p.title, p.romaji, p.native, ...p.titles]) {
    if (!t) continue;
    const n = norm(t);
    if (!n || seen.has(n)) continue;
    seen.add(n);
    const primary = t === p.title || t === p.romaji;
    index.push({ i, raw: t, n, primary, compact: n.replace(/ /g, ""), words: n.split(" "), grams: trigrams(n) });
  }
});

function matchScore(q, entry) {
  if (entry.n === q.n) return 100;
  if (entry.n.startsWith(q.n)) return 92 - Math.min(10, (entry.n.length - q.n.length) / 4);
  if (entry.compact.includes(q.compact) && q.compact.length >= 2) return 80;
  if (q.words.every(w => entry.words.some(ew => ew.startsWith(w)))) return 76;
  if (q.n.length < 3) return 0;
  let shared = 0;
  for (const g of q.grams) if (entry.grams.has(g)) shared++;
  const dice = 2 * shared / (q.grams.size + entry.grams.size);
  // Typos: compare against the start of the title too, so a short query isn't
  // punished for the rest of a long title.
  const prefix = trigrams(entry.n.slice(0, q.n.length + 2));
  let sharedPrefix = 0;
  for (const g of q.grams) if (prefix.has(g)) sharedPrefix++;
  const prefixDice = 2 * sharedPrefix / (q.grams.size + prefix.size);
  const best = Math.max(dice, prefixDice);
  return best > 0.35 ? 70 * best : 0;
}

function search(text) {
  const n = norm(text);
  if (!n) return [];
  const q = { n, compact: n.replace(/ /g, ""), words: n.split(" "), grams: trigrams(n) };
  const best = new Map();
  for (const entry of index) {
    let s = matchScore(q, entry);
    if (s <= 0) continue;
    // Prefer the main titles so results don't cite an obscure synonym.
    if (entry.primary) s += 12;
    const prev = best.get(entry.i);
    if (!prev || s > prev.score) best.set(entry.i, { score: s, via: entry.raw });
  }
  return [...best.entries()]
    .map(([i, m]) => ({ p: points[i], i, via: m.via, rank: m.score + 4 * Math.log10(points[i].popularity) }))
    .sort((a, b) => b.rank - a.rank)
    .slice(0, 8);
}

const input = document.getElementById("q");
const results = document.getElementById("results");
let current = [];
let active = 0;

function showResults() {
  current = search(input.value);
  active = 0;
  if (!current.length) {
    results.innerHTML = input.value.trim() ? `<div class="empty">Nothing matches that yet. Try the English or Japanese title, or a shorter spelling.</div>` : "";
    results.classList.toggle("open", !!input.value.trim());
    return;
  }
  results.innerHTML = current.map((r, k) => {
    const alt = norm(r.via) !== norm(r.p.title) && norm(r.via) !== norm(r.p.romaji) ? `matched “${r.via}”` : (r.p.romaji !== r.p.title ? r.p.romaji : "");
    return `<div class="result${k === 0 ? " active" : ""}" data-k="${k}" role="option">
      <img src="${esc(r.p.cover || "")}" alt="" loading="lazy">
      <div><div class="name">${esc(r.p.title)}</div>
      <div class="sub">${esc(yearFormat(r.p))}${alt ? `, ${esc(alt)}` : ""}</div></div>
    </div>`;
  }).join("");
  results.classList.add("open");
  results.querySelectorAll(".result").forEach(el => el.onclick = () => choose(+el.dataset.k));
}

function choose(k) {
  const r = current[k];
  if (!r) return;
  results.classList.remove("open");
  input.blur();
  select(r.p);
}

// ---------- mood search ----------

// Matches a description against each show's synopsis, genres and themes using
// the same sentence model the Python pipeline used (BGE-small), run in the
// browser by transformers.js. Nothing loads until the first mood search.
let mode = "title";
let mood = null;
let lastMood = "";
const MOOD_EXAMPLES = ["cozy cooking in a fantasy world", "a slow, melancholy journey with a found family", "a time loop to save friends from dying", "high school girls start a band", "a detective in a cyberpunk city", "an underdog sports team"];

function setMode(next) {
  mode = next;
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  input.placeholder = mode === "mood" ? "Describe what you're in the mood for" : "Find an anime you love";
  input.value = "";
  lastMood = "";
  moodHits = null;
  draw();
  if (mode === "mood") showExamples();
  else results.classList.remove("open");
  input.focus();
}
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

function showExamples() {
  results.innerHTML = `<div class="examples"><p>Describe a story, a feeling or a setting, then press Enter. Or try one of these:</p>
    ${MOOD_EXAMPLES.map(t => `<button type="button">${esc(t)}</button>`).join("")}</div>`;
  results.classList.add("open");
  results.querySelectorAll(".examples button").forEach(b => b.onclick = () => { input.value = b.textContent; runMood(b.textContent); });
}

function showStatus(text, progress) {
  results.innerHTML = `<div class="status">${esc(text)}${progress == null ? "" : `<div class="bar"><span style="width:${progress}%"></span></div>`}</div>`;
  results.classList.add("open");
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = src;
    tag.onload = resolve;
    tag.onerror = () => reject(new Error(`could not load ${src}`));
    document.head.appendChild(tag);
  });
}

async function loadMood() {
  if (mood) return mood;
  showStatus("Loading the language model (about 34 MB, only the first time)…", 0);
  if (!window.ANIMAP_MOOD) await loadScript("mood.js");
  const meta = window.ANIMAP_MOOD;
  const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1");
  const files = {};
  const extractor = await pipeline("feature-extraction", meta.model, {
    dtype: "q8",
    progress_callback: e => {
      if (e.status !== "progress" || !e.total) return;
      files[e.file] = [e.loaded, e.total];
      const loaded = Object.values(files).reduce((a, f) => a + f[0], 0);
      const total = Object.values(files).reduce((a, f) => a + f[1], 0);
      showStatus("Loading the language model (about 34 MB, only the first time)…", Math.round(100 * loaded / total));
    },
  });
  const bytes = Uint8Array.from(atob(meta.vectors), c => c.charCodeAt(0));
  mood = { extractor, prefix: meta.prefix, dims: meta.dims, vectors: new Int8Array(bytes.buffer) };
  return mood;
}

async function runMood(text) {
  text = text.trim();
  if (!text) return;
  lastMood = text;
  try {
    const m = await loadMood();
    showStatus("Searching…");
    const output = await m.extractor(m.prefix + text, { pooling: "cls", normalize: true });
    const q = output.data;
    const scores = points.map((p, i) => {
      let dot = 0;
      const offset = i * m.dims;
      for (let d = 0; d < m.dims; d++) dot += q[d] * m.vectors[offset + d];
      return [dot / 127, i];
    }).sort((a, b) => b[0] - a[0]).slice(0, 20);
    showMoodResults(scores.map(([, i]) => points[i]));
  } catch (err) {
    console.error(err);
    showStatus("The language model couldn't load. Check your connection and try again.");
  }
}

function showMoodResults(hits) {
  if (selected) closePanel();
  moodHits = hits;
  current = hits.map((p, k) => ({ p, i: points.indexOf(p), via: p.title }));
  active = 0;
  results.innerHTML = hits.slice(0, 8).map((p, k) => `<div class="result${k === 0 ? " active" : ""}" data-k="${k}" role="option">
      <span class="rank">${k + 1}</span>
      <img src="${esc(p.cover || "")}" alt="" loading="lazy">
      <div><div class="name">${esc(p.title)}</div>
      <div class="sub">${esc(yearFormat(p))}${p.tags.length ? `, ${esc(p.tags.slice(0, 2).join(", "))}` : ""}</div></div>
    </div>`).join("") + `<div class="empty">The top 20 are highlighted on the map.</div>`;
  results.classList.add("open");
  results.querySelectorAll(".result").forEach(el => el.onclick = () => choose(+el.dataset.k));
  frameGroup(hits.slice(0, 12));
}

function frameGroup(group) {
  const xs = group.map(q => q.x), ys = group.map(q => q.y);
  const spanX = Math.max(60, Math.max(...xs) - Math.min(...xs));
  const spanY = Math.max(60, Math.max(...ys) - Math.min(...ys));
  const left = width > 700 ? 420 : 0;
  const scale = Math.min(homeScale * 6, Math.max(homeScale, Math.min((width - left - 100) / spanX, (height - 160) / spanY)));
  flyTo((Math.max(...xs) + Math.min(...xs)) / 2 - left / 2 / scale, (Math.max(...ys) + Math.min(...ys)) / 2, scale);
}

input.addEventListener("input", () => {
  if (mode === "title") showResults();
  else if (!input.value.trim()) { moodHits = null; draw(); showExamples(); }
});
input.addEventListener("focus", () => {
  if (mode === "mood" && !input.value.trim()) showExamples();
  else if (mode === "title" && input.value.trim() && !selected) showResults();
});
input.addEventListener("keydown", e => {
  const items = results.querySelectorAll(".result[data-k]");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!items.length) return;
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((el, k) => el.classList.toggle("active", k === active));
  } else if (e.key === "Enter") {
    // In mood mode, Enter searches when the text is new, and otherwise opens
    // the highlighted result, like title mode.
    if (mode === "mood" && input.value.trim() !== lastMood) runMood(input.value);
    else choose(active);
  } else if (e.key === "Escape") {
    results.classList.remove("open");
    input.blur();
  }
});
document.addEventListener("pointerdown", e => {
  if (!document.getElementById("top").contains(e.target)) results.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
  if (e.key === "Escape" && document.activeElement !== input && selected) closePanel();
});

// ---------- helpers ----------

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function fmt(f) {
  return { TV: "TV", TV_SHORT: "TV short", MOVIE: "Movie", OVA: "OVA", ONA: "ONA", SPECIAL: "Special", MUSIC: "Music" }[f] || f;
}
function yearFormat(p) {
  return [p.year, fmt(p.format)].filter(Boolean).join(" ");
}
function tier(score) {
  return score >= 82 ? "top" : score >= 72 ? "good" : "ok";
}

window.addEventListener("resize", resize);
resize();
fitAll();
applySize();
// Canvas text uses the web font only once it has loaded.
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
